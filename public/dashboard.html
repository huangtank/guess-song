<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ntust camp 2026 - 後台控制台</title>
    <!-- 引入像素風格字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
    <script src="/js/scores.js" defer></script>
    <script src="/js/dashboard.js" defer></script>
    <script src="/js/quiz.js" defer></script>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <!-- 一模一樣的頂端置頂欄 -->
    <header class="top-header">
        <a class="header-title" href="/">誰是猜歌王</a>
    </header>

    <!-- 分數顯示區域 (4 隊網格) -->
    <main class="score-container">
        <div class="team-card" id="t1">
            <span class="team-label">第一隊</span>
            <textarea class="score-box" maxlength="2" rows="1" placeholder="0" readonly></textarea>
        </div>
        <div class="team-card" id="t2">
            <span class="team-label">第二隊</span>
            <textarea class="score-box" maxlength="2" rows="1" placeholder="0" readonly></textarea>
        </div>
        <div class="team-card" id="t3">
            <span class="team-label">第三隊</span>
            <textarea class="score-box" maxlength="2" rows="1" placeholder="0" readonly></textarea>
        </div>
        <div class="team-card" id="t4">
            <span class="team-label">第四隊</span>
            <textarea class="score-box" maxlength="2" rows="1" placeholder="0" readonly></textarea>
        </div>
    </main>

    <!-- 控制面板容器 -->
    <section class="control-container">
        
        <!-- 格子 1：快速加分 -->
        <div class="control-card">
            <h2 class="card-title">🎮 快速加分</h2>
            
            <div class="input-row">
                <label for="group">組別 (1-4)</label>
                <input id="group" type="number" min="1" max="4" placeholder="組別">
            </div>

            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input id="year" type="checkbox">
                    <span class="custom-checkbox"></span>
                    年份 (+1)
                </label>

                <label class="checkbox-label">
                    <input id="name" type="checkbox">
                    <span class="custom-checkbox"></span>
                    歌名 (+1)
                </label>

                <label class="checkbox-label">
                    <input id="sing" type="checkbox">
                    <span class="custom-checkbox"></span>
                    唱 (+1)
                </label>

                <label class="checkbox-label">
                    <input id="dance" type="checkbox">
                    <span class="custom-checkbox"></span>
                    跳 (+1)
                </label>
            </div>

            <button id="add_score_btn" class="mc-button btn-green">送出加分</button>
        </div>

        <!-- 格子 2：直接設定分數 -->
        <div class="control-card">
            <h2 class="card-title">✏️ 直接設定分數</h2>
            <p class="card-subtitle">打錯分數時使用</p>

            <div class="input-row">
                <label for="group_set">組別 (1-4)</label>
                <input id="group_set" type="number" min="1" max="4" placeholder="組別">
            </div>

            <div class="input-row">
                <label for="score">目標分數</label>
                <input id="score" type="number" min="0" max="99" placeholder="分數">
            </div>

            <button id="set_score_btn" class="mc-button btn-gold">重設分數</button>
        </div>

        <!-- 格子 3：發題 / 收卷 -->
        <div class="control-card">
            <h2 class="card-title">🎵 發題 / 收卷</h2>
            <p id="quiz_status" class="card-subtitle">尚未發題</p>

            <div class="input-row">
                <label for="quiz_song">題目</label>
                <select id="quiz_song"></select>
            </div>

            <button id="open_btn" class="mc-button btn-green">發題</button>
            <button id="close_btn" class="mc-button btn-gold">收卷並計分</button>
        </div>

        <!-- 格子 4：組別密碼 -->
        <div class="control-card">
            <h2 class="card-title">🔑 組別密碼</h2>
            <p class="card-subtitle">留空 = 該組不能加入</p>
            <div id="group_passwords" class="password-grid"></div>
            <button id="save_pw_btn" class="mc-button btn-gold">儲存密碼</button>
        </div>

        <!-- 格子 5：作答狀況 -->
        <div class="control-card wide-card">
            <h2 class="card-title">📋 作答狀況</h2>
            <p id="answer_key" class="card-subtitle"></p>
            <p id="answer_summary" class="card-subtitle"></p>
            <p class="card-subtitle">點分數可以人工改判（年份 +3 → +1 → ✗ 輪流切換），切回原本的分數就是還原；收卷後改判會自動加減分</p>
            <div class="table-wrap">
                <table class="answer-table">
                    <thead>
                        <tr><th>組</th><th>名字</th><th>年份</th><th>歌手</th><th>歌名</th></tr>
                    </thead>
                    <tbody id="answer_rows"></tbody>
                </table>
            </div>
        </div>

        <!-- 格子 6：歌單 -->
        <div class="control-card wide-card">
            <h2 class="card-title">📀 歌單與解答</h2>
            <p class="card-subtitle">
                JSON 陣列，格式見 songs.example.json；歌手、歌名可以填多種寫法。
                解答只存在伺服器，比賽開始後請不要調換順序。
            </p>
            <input id="songs_file" type="file" accept=".json,application/json">
            <textarea id="songs_json" class="songs-json" rows="10" spellcheck="false"></textarea>
            <button id="save_songs_btn" class="mc-button btn-gold">儲存歌單</button>
        </div>

        <!-- 登出區塊 -->
        <div class="logout-wrapper">
            <button id="logout_btn" class="mc-button btn-red">登出系統</button>
        </div>

    </section>
</body>
</html>
